<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="1" />
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.15" />
    </pattern>
  </defs>
  <style>
    .title {
      font-family: "Geist", "Geist Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 160px;
      font-style: italic;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      fill: #ffffff;
      filter: url(#drop-shadow);
      text-anchor: middle;
      dominant-baseline: central;
    }
    .violet {
      fill: #8b5cf6;
    }
  </style>
  
  <rect width="100%" height="100%" fill="#09090b" />
  <rect width="100%" height="100%" fill="url(#scanlines)" />

  <text x="50%" y="42%" class="title">SHIMO</text>
  <text x="50%" y="60%" class="title violet">KITAN</text>
</svg>
